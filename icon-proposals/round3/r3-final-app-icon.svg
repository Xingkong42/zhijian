<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FCEFCB"/>
      <stop offset="1" stop-color="#E5BE66"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.40"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="flap" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#FDF8EC"/>
      <stop offset="1" stop-color="#E7D6A8"/>
    </linearGradient>
    <filter id="sh" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#3A3833" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- 底：暖金渐变 + 顶部光泽 + 内圈高光 -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="24" y="14" width="464" height="238" rx="96" fill="url(#sheen)"/>
  <rect x="14" y="14" width="484" height="484" rx="100" fill="none" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="7"/>

  <g transform="translate(8,10)">
    <!-- 底层纸（最靠左下） -->
    <g filter="url(#sh)">
      <rect x="124" y="130" width="268" height="268" rx="20" fill="#F1E6CE"/>
    </g>
    <!-- 中层纸 -->
    <g filter="url(#sh)">
      <rect x="138" y="117" width="268" height="268" rx="20" fill="#F9F1DF"/>
    </g>
    <!-- 顶层纸：右下折角 -->
    <g filter="url(#sh)">
      <path d="M172 104 L400 104 A20 20 0 0 1 420 124 L420 294 L342 372 L172 372 A20 20 0 0 1 152 352 L152 124 A20 20 0 0 1 172 104 Z" fill="#FFFCF3"/>
      <!-- 折角内衬（暖金） -->
      <path d="M424 288 C424 338 398 360 336 378 C378 350 410 322 424 288 Z" fill="#C9A227"/>
      <!-- 折起的纸角 -->
      <path d="M420 294 C414 332 394 354 342 372 C376 344 402 322 420 294 Z" fill="url(#flap)"/>
    </g>
    <!-- 一笔书法墨痕：左下顿笔（钝切）→ 右上收锋（尖） -->
    <path d="M224 290 C250 236 300 200 362 192 C330 232 288 282 254 304 Z" fill="#3A3833"/>
  </g>
</svg>